name: relay

# Serverless fallback for the long-lived worker. Every 30 minutes the runner derives its
# cursor from chain state (RootRelayed events + processedQueries), relays whatever is
# outstanding, and commits the evidence log back to the repo.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source chain to relay"
        type: choice
        options: [all, mainnet, sepolia]
        default: all
      dry_run:
        description: "Do everything except sending transactions"
        type: boolean
        default: false
      from_block:
        description: "Optional source block to start from (cursor only moves forward)"
        type: string
        default: ""

concurrency:
  group: relay
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preflight (precompiles, attested heights, quorum, bn128)
        env:
          CREDITCOIN_WALLET_PRIVATE_KEY: ${{ secrets.CREDITCOIN_WALLET_PRIVATE_KEY }}
          ETH_MAINNET_RPC: ${{ secrets.ETH_MAINNET_RPC }}
          ETH_SEPOLIA_RPC: ${{ secrets.ETH_SEPOLIA_RPC }}
        run: bun run worker/src/cli.ts check

      - name: Relay
        env:
          CREDITCOIN_WALLET_PRIVATE_KEY: ${{ secrets.CREDITCOIN_WALLET_PRIVATE_KEY }}
          ETH_MAINNET_RPC: ${{ secrets.ETH_MAINNET_RPC }}
          ETH_SEPOLIA_RPC: ${{ secrets.ETH_SEPOLIA_RPC }}
          SOURCE: ${{ inputs.source || 'all' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          FROM_BLOCK: ${{ inputs.from_block }}
        run: |
          args="relay --source $SOURCE --once $DRY_RUN"
          if [ -n "$FROM_BLOCK" ]; then args="$args --from $FROM_BLOCK"; fi
          bun run worker/src/cli.ts $args

      - name: Status
        if: always()
        env:
          CREDITCOIN_WALLET_PRIVATE_KEY: ${{ secrets.CREDITCOIN_WALLET_PRIVATE_KEY }}
          ETH_MAINNET_RPC: ${{ secrets.ETH_MAINNET_RPC }}
          ETH_SEPOLIA_RPC: ${{ secrets.ETH_SEPOLIA_RPC }}
        run: bun run worker/src/cli.ts status

      - name: Commit evidence
        if: always()
        run: |
          if [ -z "$(git status --porcelain evidence/)" ]; then
            echo "no new evidence"
            exit 0
          fi
          git config user.name "humanline-relay[bot]"
          git config user.email "humanline-relay@users.noreply.github.com"
          git add evidence/
          git commit -m "chore(relay): evidence $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # Another run may have pushed in the meantime; rebase onto it and retry once.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
